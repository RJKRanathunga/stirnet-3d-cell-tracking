[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-tracking"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src", "src.*",
    "learned", "learned.*",
    "dataset_curation", "dataset_curation.*",
    "diagnostics", "diagnostics.*",
    "legacy", "legacy.*",
]
